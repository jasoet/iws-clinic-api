[project]
name = "book-builder"
version = "0.1.0"
description = "Build the book: markdown -> HTML + PDF"
requires-python = ">=3.11"
dependencies = [
    "markdown>=3.5",
    "pymdown-extensions>=10.0",
    "pygments>=2.17",
    "playwright>=1.42",  # page.pdf(tagged=, outline=) needs 1.42+
]

[project.optional-dependencies]
# Only for the multi-page mkdocs site: uv sync --extra site
site = [
    "mkdocs-material>=9.5",
    "mkdocs-print-site-plugin>=2.5",
]

[tool.uv]
# Pin the Python version uv uses for this project's venv
# (uncomment and adjust if you need a specific minor version)
# python = "3.12"

# Notes:
#   - Run `uv sync` once to create .venv and install dependencies (writes uv.lock)
#   - Run `uv run python build.py` (or `uv run build.py`) thereafter — fast, no re-resolution
#   - Commit pyproject.toml AND uv.lock for reproducible builds
#   - .venv/ should be gitignored
