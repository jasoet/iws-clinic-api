name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ["8.4", "8.6"]
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo_sqlite, pdo_pgsql
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: ./vendor/bin/pint --test
      - run: ./vendor/bin/pest

  gmc:
    name: GMC queries on PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: gmc
          POSTGRES_PASSWORD: gmc-test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d gmc"
          --health-interval 2s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql
          coverage: none
      - run: composer install --no-interaction --prefer-dist
      - run: ./vendor/bin/pest --group=gmc
        env:
          GMC_TEST_DB_HOST: 127.0.0.1
          GMC_TEST_DB_PORT: "5432"
          GMC_TEST_DB_PASSWORD: gmc-test

  docker:
    name: image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t iws-clinic-api:ci .
